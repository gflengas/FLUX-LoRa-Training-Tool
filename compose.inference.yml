services:
  comfyui:
    build:
      context: ./comfyui
    restart: "no"
    ports:
      - "127.0.0.1:8188:8188"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /data/user
    volumes:
      - ./models:/opt/ComfyUI/models:ro
      - ./outputs/comfyui:/data/output
      - ./.runtime/comfyui-input:/data/input
      - ./.runtime/comfyui-user:/data/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 3
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--disable-auto-launch", "--disable-all-custom-nodes", "--disable-api-nodes", "--output-directory", "/data/output", "--input-directory", "/data/input", "--user-directory", "/data/user"]
